<!DOCTYPE html>

<html class="dark" lang="en" style=""><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ADAS Workshop - Sensor Suite</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&amp;family=Geist:wght@300;400;500&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "error-container": "#93000a",
                "surface-dim": "#131315",
                "on-primary-fixed-variant": "#004493",
                "surface-glass": "rgba(28, 28, 30, 0.7)",
                "error": "#ffb4ab",
                "primary-container": "#4b8eff",
                "secondary-container": "#3e90ff",
                "outline-variant": "#414755",
                "tertiary-fixed-dim": "#c2c1ff",
                "tertiary-container": "#8382ff",
                "data-sensor-ray": "#64D2FF",
                "surface-container": "#1f1f21",
                "on-tertiary-fixed-variant": "#332dbc",
                "on-primary-fixed": "#001a41",
                "primary-fixed": "#d8e2ff",
                "on-secondary-fixed": "#001b3e",
                "on-error-container": "#ffdad6",
                "on-tertiary": "#1800a7",
                "inverse-surface": "#e4e2e4",
                "primary-fixed-dim": "#adc6ff",
                "surface-bright": "#39393b",
                "tertiary-fixed": "#e2dfff",
                "on-tertiary-fixed": "#0c006b",
                "surface-container-low": "#1b1b1d",
                "inverse-primary": "#005bc1",
                "surface-tint": "#adc6ff",
                "primary": "#adc6ff",
                "status-success": "#9dff21",
                "interface-navy": "#09090B",
                "surface-variant": "#353437",
                "on-secondary-fixed-variant": "#00468d",
                "status-critical": "#FF453A",
                "surface": "#131315",
                "on-primary-container": "#00285c",
                "secondary-fixed": "#d6e3ff",
                "outline": "#8b90a0",
                "on-primary": "#002e69",
                "status-warning": "#FF9F0A",
                "tertiary": "#c2c1ff",
                "on-secondary": "#003064",
                "inverse-on-surface": "#303032",
                "background": "#131315",
                "surface-container-lowest": "#0e0e10",
                "on-surface-variant": "#c1c6d7",
                "on-background": "#e4e2e4",
                "surface-container-high": "#2a2a2c",
                "on-secondary-container": "#002957",
                "surface-container-highest": "#353437",
                "on-tertiary-container": "#140094",
                "on-surface": "#e4e2e4",
                "on-error": "#690005",
                "secondary": "#aac7ff",
                "secondary-fixed-dim": "#aac7ff",
                "neon-green": "#9dff21"
            },
            "borderRadius": {
                "DEFAULT": "0.125rem",
                "lg": "0.25rem",
                "xl": "0.5rem",
                "full": "0.75rem"
            },
            "spacing": {
                "stack-gap": "16px",
                "container-margin": "20px",
                "gutter-sm": "12px",
                "unit": "4px",
                "touch-target-min": "44px"
            },
            "fontFamily": {
                "headline-md": ["Sora"],
                "headline-lg-mobile": ["Sora"],
                "body-sm": ["Geist"],
                "body-md": ["Geist"],
                "label-caps": ["JetBrains Mono"],
                "data-display": ["JetBrains Mono"],
                "headline-lg": ["Sora"]
            },
            "fontSize": {
                "headline-md": ["20px", { "lineHeight": "1.3", "fontWeight": "600" }],
                "headline-lg-mobile": ["24px", { "lineHeight": "1.2", "fontWeight": "700" }],
                "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                "label-caps": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "500" }],
                "data-display": ["18px", { "lineHeight": "1.0", "fontWeight": "700" }],
                "headline-lg": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }]
            }
          },
        },
      }
    </script>
<style>
      .sensor-pulse {
        animation: pulse-glow 2s infinite;
      }
      @keyframes pulse-glow {
        0% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.3); opacity: 0.2; }
        100% { transform: scale(1); opacity: 0.8; }
      }
      .active-accent {
        box-shadow: 0 0 15px rgba(157, 255, 33, 0.4);
        border-color: #9dff21 !important;
      }
      .glass-blur {
        backdrop-filter: blur(12px);
      }
      .hotspot-hidden {
        display: none !important;
      }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen pb-32">
<!-- TopAppBar -->
<header class="bg-surface-glass dark:bg-surface-glass w-full top-0 sticky border-b border-outline-variant backdrop-blur-xl shadow-none flex items-center justify-between px-container-margin h-touch-target-min z-50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="menu">menu</span>
<h1 class="font-headline-md text-headline-md-mobile font-bold text-primary tracking-tight uppercase">ADAS Workshop</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="settings">settings</span>
</div>
</header>
<main class="flex flex-col gap-stack-gap px-container-margin mt-4">
<!-- Hero Section: Interactive X-Ray -->
<section class="relative rounded-xl overflow-hidden bg-surface-container-low border border-outline-variant aspect-video">
<img alt="Kia Telluride 2027 X-Ray Sensor Suite Diagram" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida/AP1WRLthDSBRA9ER26rh8ZoHSI8g_W472r9siFjiVwWHYVE7J7YprreCX3FvJavr8SiEmrallpSKkpECC23uylsYLglGo_Gnf4jv8VeD_2kQ0s8evPmjU__BOSs-6wiisqT1RKAYOAW07w5jtLw386gNfXT3lwp1OQMWm849UCuTZfcYcHzMFk0eYfqzizTatJnDMBVTrAcTD3236kzbo2L2lXmQ-abulKuKVesM6Jy3U_2b-BwbrN9KEjGg"/>
<!-- Radar Hotspots (Front & Rear) -->
<div class="absolute top-[52%] left-[16%] w-8 h-8 rounded-full bg-neon-green/30 border border-neon-green flex items-center justify-center sensor-pulse hotspot" data-sensor="radar">
<div class="w-2 h-2 rounded-full bg-neon-green shadow-[0_0_8px_#9dff21]"></div>
</div>
<div class="absolute top-[58%] left-[88%] w-8 h-8 rounded-full bg-neon-green/30 border border-neon-green flex items-center justify-center sensor-pulse hotspot" data-sensor="radar">
<div class="w-2 h-2 rounded-full bg-neon-green shadow-[0_0_8px_#9dff21]"></div>
</div>
<!-- LiDAR Hotspot (Roof) -->
<div class="absolute top-[28%] left-[48%] w-8 h-8 rounded-full bg-neon-green/30 border border-neon-green flex items-center justify-center sensor-pulse hotspot" data-sensor="lidar">
<div class="w-2 h-2 rounded-full bg-neon-green shadow-[0_0_8px_#9dff21]"></div>
</div>
<!-- Camera Hotspots (Windshield & Mirrors) -->
<div class="absolute top-[35%] left-[43%] w-8 h-8 rounded-full bg-neon-green/30 border border-neon-green flex items-center justify-center sensor-pulse hotspot" data-sensor="cameras">
<div class="w-2 h-2 rounded-full bg-neon-green shadow-[0_0_8px_#9dff21]"></div>
</div>
<div class="absolute top-[42%] left-[38%] w-8 h-8 rounded-full bg-neon-green/30 border border-neon-green flex items-center justify-center sensor-pulse hotspot" data-sensor="cameras">
<div class="w-2 h-2 rounded-full bg-neon-green shadow-[0_0_8px_#9dff21]"></div>
</div>
<!-- Parking Sensor Hotspots (Bumpers) -->
<div class="absolute top-[65%] left-[12%] w-8 h-8 rounded-full bg-neon-green/30 border border-neon-green flex items-center justify-center sensor-pulse hotspot" data-sensor="ultrasonics">
<div class="w-2 h-2 rounded-full bg-neon-green shadow-[0_0_8px_#9dff21]"></div>
</div>
<div class="absolute top-[62%] left-[82%] w-8 h-8 rounded-full bg-neon-green/30 border border-neon-green flex items-center justify-center sensor-pulse hotspot" data-sensor="ultrasonics">
<div class="w-2 h-2 rounded-full bg-neon-green shadow-[0_0_8px_#9dff21]"></div>
</div>
<!-- Active Label Overlay -->
<div class="absolute bottom-4 left-4 bg-surface-glass border border-outline-variant px-3 py-1.5 rounded-full flex items-center gap-2 transition-all" id="sensor-badge">
<span class="w-2 h-2 rounded-full bg-neon-green animate-pulse"></span>
<span class="font-label-caps text-label-caps text-on-surface tracking-widest" id="active-sensor-name">SENSOR SUITE: OVERVIEW</span>
</div>
</section>
<!-- 2027 KIA TELLURIDE Specs -->
<section class="bg-surface-container-low border border-outline-variant rounded-xl p-4 transition-all duration-300" id="spec-card">
<div class="flex justify-between items-start mb-4">
<div>
<h2 class="font-headline-md text-primary tracking-tight" id="spec-title">2027 KIA TELLURIDE</h2>
<p class="font-label-caps text-[10px] text-on-surface-variant uppercase tracking-widest" id="spec-subtitle">Global Platform Configuration</p>
</div>
<span class="material-symbols-outlined text-on-surface-variant/40" id="spec-icon">directions_car</span>
</div>
<div class="grid grid-cols-1 gap-3" id="spec-grid">
<div class="flex items-center justify-between p-3 bg-surface-container rounded-lg border border-outline-variant">
<span class="font-label-caps text-label-caps text-on-surface-variant">SENSOR CAPACITY</span>
<div class="font-data-display text-data-display text-primary">24 TOTAL</div>
</div>
<div class="flex items-center justify-between p-3 bg-surface-container rounded-lg border border-outline-variant">
<span class="font-label-caps text-label-caps text-on-surface-variant">COMPUTE UNIT</span>
<div class="font-data-display text-data-display text-primary">NVIDIA ORIN</div>
</div>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-relaxed mt-4" id="spec-description">Select a sensor group below to view detailed technical specifications and active module locations.</p>
</section>
<!-- Sensor Tabs (Quick Access) -->
<div class="grid grid-cols-2 gap-3">
<button class="sensor-tab flex flex-col items-center justify-center gap-1 p-4 rounded-xl border border-outline-variant bg-surface-container-high hover:bg-surface-variant active:scale-95 transition-all" id="tab-radar" onclick="selectSensor('radar')">
<span class="material-symbols-outlined text-primary text-2xl">radar</span>
<span class="font-label-caps text-[10px]">RADAR</span>
</button>
<button class="sensor-tab flex flex-col items-center justify-center gap-1 p-4 rounded-xl border border-outline-variant bg-surface-container-high hover:bg-surface-variant active:scale-95 transition-all" id="tab-lidar" onclick="selectSensor('lidar')">
<span class="material-symbols-outlined text-primary text-2xl">view_in_ar</span>
<span class="font-label-caps text-[10px]">LiDAR</span>
</button>
<button class="sensor-tab flex flex-col items-center justify-center gap-1 p-4 rounded-xl border border-outline-variant bg-surface-container-high hover:bg-surface-variant active:scale-95 transition-all" id="tab-cameras" onclick="selectSensor('cameras')">
<span class="material-symbols-outlined text-primary text-2xl">photo_camera</span>
<span class="font-label-caps text-[10px]">CAMERAS</span>
</button>
<button class="sensor-tab flex flex-col items-center justify-center gap-1 p-4 rounded-xl border border-outline-variant bg-surface-container-high hover:bg-surface-variant active:scale-95 transition-all" id="tab-ultrasonics" onclick="selectSensor('ultrasonics')">
<span class="material-symbols-outlined text-primary text-2xl">settings_input_antenna</span>
<span class="font-label-caps text-[10px]">PARKING</span>
</button>
</div>
<button class="w-full py-4 mt-2 rounded-xl border border-outline bg-surface-container-highest font-label-caps text-on-surface hover:bg-surface-variant transition-all" onclick="selectSensor('overview')">
    RESET OVERVIEW
</button>
</main>
<script>
    const sensorData = {
        overview: {
            title: "2027 KIA TELLURIDE",
            subtitle: "Global Platform Configuration",
            icon: "directions_car",
            desc: "The 2027 Telluride features an integrated sensor mesh providing 360° situational awareness for Level 3 autonomy.",
            metrics: [
                { label: "SENSOR CAPACITY", value: "24 TOTAL" },
                { label: "COMPUTE UNIT", value: "NVIDIA ORIN" }
            ]
        },
        radar: {
            title: "LONG-RANGE RADAR",
            subtitle: "All-Weather Spatial Detection",
            icon: "radar",
            desc: "High-frequency radar units providing 'Long-range detection' and depth tracking in fog, heavy rain, or snow where optical sensors struggle.",
            metrics: [
                { label: "FREQUENCY", value: "77 GHz" },
                { label: "RANGE", value: "250m" },
                { label: "FOV", value: "120°" }
            ]
        },
        lidar: {
            title: "TOP-MOUNTED LiDAR",
            subtitle: "High-Res 3D Mapping",
            icon: "view_in_ar",
            desc: "Solid-state LiDAR providing 'High-res 3D mapping' of the environment, crucial for precise object localization and obstacle avoidance.",
            metrics: [
                { label: "SCAN TYPE", value: "SOLID-STATE" },
                { label: "RESOLUTION", value: "0.1°" },
                { label: "RADIUS", value: "200m" }
            ]
        },
        cameras: {
            title: "TRIPLE CAM-SUITE",
            subtitle: "High-Dynamic Range Vision",
            icon: "photo_camera",
            desc: "Multi-modal camera array for semantic segmentation, lane detection, and sign recognition across variable lighting conditions.",
            metrics: [
                { label: "RESOLUTION", value: "3x 8MP" },
                { label: "FPS", value: "60 FPS" },
                { label: "SPECTRUM", value: "RGB-IR" }
            ]
        },
        ultrasonics: {
            title: "PARKING MESH",
            subtitle: "Proximity Awareness Array",
            icon: "settings_input_antenna",
            desc: "Ultrasonic sensor mesh delivering centimeter-accurate proximity data for low-speed automated parking and urban navigation.",
            metrics: [
                { label: "SENSOR COUNT", value: "12 UNITS" },
                { label: "PRECISION", value: "±1.5cm" },
                { label: "MAX DIST", value: "5m" }
            ]
        }
    };

    function selectSensor(id) {
        const data = sensorData[id];
        
        // Update text content
        document.getElementById('active-sensor-name').innerText = id === 'overview' ? `SENSOR SUITE: OVERVIEW` : `SENSOR: ${id.toUpperCase()}`;
        document.getElementById('spec-title').innerText = data.title;
        document.getElementById('spec-subtitle').innerText = data.subtitle;
        document.getElementById('spec-icon').innerText = data.icon;
        document.getElementById('spec-description').innerText = data.desc;

        // Update Metrics Grid
        const grid = document.getElementById('spec-grid');
        let metricsHtml = '';
        data.metrics.forEach(m => {
            metricsHtml += `
                <div class="flex items-center justify-between p-3 bg-surface-container rounded-lg border border-outline-variant">
                    <span class="font-label-caps text-label-caps text-on-surface-variant">${m.label}</span>
                    <div class="font-data-display text-data-display text-neon-green">${m.value}</div>
                </div>
            `;
        });
        grid.innerHTML = metricsHtml;

        // Update Hotspot visibility
        const hotspots = document.querySelectorAll('.hotspot');
        hotspots.forEach(hs => {
            if (id === 'overview' || hs.getAttribute('data-sensor') === id) {
                hs.classList.remove('hotspot-hidden');
            } else {
                hs.classList.add('hotspot-hidden');
            }
        });

        // Update Tabs styling
        document.querySelectorAll('.sensor-tab').forEach(tab => {
            tab.classList.remove('active-accent', 'bg-neon-green/10', 'border-neon-green');
            tab.querySelector('span:first-child').style.color = '';
        });

        if (id !== 'overview') {
            const activeTab = document.getElementById(`tab-${id}`);
            activeTab.classList.add('active-accent', 'bg-neon-green/10', 'border-neon-green');
            activeTab.querySelector('span:first-child').style.color = '#9dff21';
        }

        // Visual Feedback on card
        const card = document.getElementById('spec-card');
        card.classList.add('active-accent');
        setTimeout(() => card.classList.remove('active-accent'), 800);
    }
</script>
</body></html>
