<script>
    function toggleSelect(el) {
        const parent = el.parentElement;
        parent.querySelectorAll('button').forEach(btn => {
            btn.classList.remove('bg-primary-fixed', 'text-on-primary-fixed', 'border-primary-fixed', 'neon-glow');
            btn.classList.add('bg-surface-container-low', 'text-secondary', 'border-outline-variant');
        });
        
        el.classList.remove('bg-surface-container-low', 'text-secondary', 'border-outline-variant');
        el.classList.add('bg-primary-fixed', 'text-on-primary-fixed', 'border-primary-fixed', 'neon-glow');
    }

    // Atmospheric pulse for status badge
    const badge = document.getElementById('status-badge');
    if(badge) {
        setInterval(() => {
            badge.style.opacity = badge.style.opacity === '0.6' ? '1' : '0.6';
        }, 1000);
    }
</script>
