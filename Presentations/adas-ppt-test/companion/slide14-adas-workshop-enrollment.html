<section class="lg:col-span-5">
<div class="glass-panel p-8 rounded-xl flex flex-col gap-8 sticky top-24">
<div class="flex flex-col gap-2">
<h3 class="font-headline-md text-headline-md text-primary">Roster:</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Complete the form below to initialize your session.</p>
</div>
<form class="flex flex-col gap-6" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-2 neon-border-focus group">
<label class="font-label-md text-label-md text-on-surface-variant group-focus-within:text-primary-fixed transition-colors" for="full_name">FULL NAME</label>
<input class="bg-[#121214] border-0 border-b border-[#3A3D42] py-3 text-primary font-body-md focus:ring-0 focus:border-primary-fixed placeholder:text-surface-container-highest transition-all" id="full_name" placeholder="Lead Engineer Name" type="text">
</div>
<div class="flex flex-col gap-2 neon-border-focus group">
<label class="font-label-md text-label-md text-on-surface-variant group-focus-within:text-primary-fixed transition-colors" for="dealer_code">DEALER CODE</label>
<input class="bg-[#121214] border-0 border-b border-[#3A3D42] py-3 text-primary font-body-md focus:ring-0 focus:border-primary-fixed placeholder:text-surface-container-highest transition-all [appearance:textfield] [&amp;::-webkit-outer-spin-button]:appearance-none [&amp;::-webkit-inner-spin-button]:appearance-none" id="dealer_code" placeholder="Enter Numeric Code" type="number">
</div>
<div class="flex flex-col gap-2 neon-border-focus group">
<label class="font-label-md text-label-md text-on-surface-variant group-focus-within:text-primary-fixed transition-colors" for="kuid">KUID</label>
<input class="bg-[#121214] border-0 border-b border-[#3A3D42] py-3 text-primary font-body-md focus:ring-0 focus:border-primary-fixed placeholder:text-surface-container-highest transition-all uppercase" id="kuid" placeholder="Alphanumeric ID" type="text">
</div>
<div class="flex flex-col gap-4 mt-4">
<div class="flex items-center gap-3">
<input class="rounded-sm bg-surface-container-low border-outline text-primary-fixed focus:ring-primary-fixed/50" id="terms" type="checkbox">
<label class="text-label-sm font-label-sm text-on-surface-variant" for="terms">Agree To Important Things</label>
</div>
</div>
<button id="initSessionBtn" class="w-full bg-primary-container text-on-primary font-label-md text-label-md h-14 rounded-sm hover:neon-glow hover:scale-[1.02] active:scale-[0.98] transition-all duration-200 flex items-center justify-center gap-2" type="button">
                        LOCK IN
                        <span class="material-symbols-outlined text-[20px]">bolt</span>
</button>
<p id="rosterStatus" class="text-center text-label-sm font-label-sm mt-2" style="min-height:18px;"></p>

<script>
        // Micro-interaction: Focus effect for inputs
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').style.letterSpacing = '0.1em';
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').style.letterSpacing = '0.05em';
            });
        });

        // Atmospheric pulse for "READY" badge
        const badge = document.querySelector('.bg-primary-container\\/10');
        if(badge) {
            setInterval(() => {
                badge.style.opacity = badge.style.opacity === '0.6' ? '1' : '0.6';
            }, 1000);
        }
    </script>
