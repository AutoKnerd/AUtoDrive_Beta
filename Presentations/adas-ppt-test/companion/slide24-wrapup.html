<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wrap-Up</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
<style>
  :root { --blue:#38bdf8; --good:#8eff71; --bg:#0c0f14; --card:#161b22; --line:#2a313c; --ink:#e6e9ee; --muted:#93a1b3; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Sora',system-ui,sans-serif;
         min-height:100vh; display:flex; flex-direction:column; justify-content:center; padding:34px 20px; }
  .eyebrow { color:var(--blue); font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; }
  h1 { font-size:32px; margin:8px 0 8px; }
  p.lead { color:var(--muted); font-size:14px; line-height:1.6; margin:0 0 24px; }
  .done { display:flex; gap:12px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 15px; margin-bottom:10px; font-size:14px; }
  .done .material-symbols-outlined { color:var(--good); }
  .next { margin-top:22px; color:var(--blue); font-size:13px; font-weight:700; text-align:center; }
</style>
</head>
<body>
  <div class="eyebrow">04 · Wrap-Up</div>
  <h1>That's a wrap.</h1>
  <p class="lead">Look how far you came today — here's what you did:</p>
  <div class="done"><span class="material-symbols-outlined">check_circle</span> Explored ADAS &amp; the 2027 Telluride sensors</div>
  <div class="done"><span class="material-symbols-outlined">check_circle</span> Built your driver confidence profile</div>
  <div class="done"><span class="material-symbols-outlined">check_circle</span> Consulted real customers — Jamie &amp; Ryan</div>
  <div class="next">Next: your takeaways, resources, and your session impact →</div>
</body>
</html>
