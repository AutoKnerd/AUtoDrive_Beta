<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADAS Workshop — Baseline Check</title>
  <link href="/Presentations/_shared/deck-controls.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    html, body { margin:0; width:100%; height:100%; background:#05070c; font-family:'Sora',system-ui,sans-serif; }
    body { display:grid; place-items:center; overflow:hidden; }
    .slide { position:relative; width:100vw; height:56.25vw; max-height:100vh; max-width:177.78vh; overflow:hidden;
             background:radial-gradient(circle at 20% 20%, rgba(56,189,248,.12), transparent 40%), linear-gradient(180deg,#0a0e15,#05070c); }
    .inner { position:absolute; inset:0; display:flex; flex-direction:column; justify-content:center; padding:0 9vw; color:#e6e9ee; }
    .eyebrow { color:#38bdf8; font-size:1.4vw; font-weight:700; letter-spacing:.25em; text-transform:uppercase; }
    h1 { font-size:6vw; margin:.4vw 0 1.5vw; line-height:1; }
    p { font-size:1.8vw; color:#93a1b3; max-width:48vw; line-height:1.5; margin:0; }
    .chip { display:inline-flex; align-items:center; gap:.8vw; margin-top:2.4vw; background:rgba(56,189,248,.1);
            border:1px solid rgba(56,189,248,.4); color:#38bdf8; border-radius:999px; padding:1vw 2vw; font-size:1.5vw; font-weight:700; }
  </style>
</head>
<body>
  <main class="slide" data-slide-step="slide34">
    <div class="inner">
      <div class="eyebrow">Before we start</div>
      <h1>Quick Baseline Check</h1>
      <p>Grab your phone and open your companion — a 60-second confidence rating and a 6-question knowledge check. We'll measure how far you go by the end.</p>
      <div class="chip">📱 Open your companion to begin</div>
    </div>
  </main>
  <script src="/Presentations/_shared/deck-controls.js"></script>
</body>
</html>
