<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Session Evaluation</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --blue:#38bdf8; --blue-dim:#0ea5e9; --bg:#0c0f14; --card:#161b22; --line:#2a313c; --ink:#e6e9ee; --muted:#93a1b3; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Sora',system-ui,sans-serif; padding:24px 16px 80px; }
  .eyebrow { color:var(--blue); font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; }
  h1 { font-size:26px; margin:6px 0 6px; }
  p.lead { color:var(--muted); font-size:13px; margin:0 0 22px; }
  .q { font-size:14px; font-weight:600; margin:20px 0 8px; }
  .scale { display:flex; gap:6px; }
  .scale button { flex:1; background:var(--card); border:1px solid var(--line); border-radius:10px; color:var(--ink); font:inherit; font-size:11px; font-weight:600; padding:10px 2px; cursor:pointer; transition:all .12s; }
  .scale button.on { border-color:var(--blue); background:rgba(56,189,248,.1); color:var(--blue); }
  textarea { width:100%; min-height:64px; background:var(--card); border:1px solid var(--line); border-radius:12px; color:var(--ink); font:inherit; font-size:13px; padding:11px; resize:vertical; margin-top:4px; }
  textarea:focus { outline:none; border-color:var(--blue); }
  .btn { width:100%; background:var(--blue); color:#04222f; border:none; border-radius:12px; padding:14px; font:inherit; font-weight:700; font-size:15px; cursor:pointer; margin-top:22px; }
  .btn:active { background:var(--blue-dim); }
  .status { text-align:center; font-size:12px; min-height:18px; margin-top:10px; color:var(--blue); }
</style>
</head>
<body>
  <div class="eyebrow">Session Evaluation</div>
  <h1>How was today?</h1>
  <p class="lead">Your feedback helps Kia University. 30 seconds, anonymous to the room.</p>

  <div id="likert"></div>

  <div class="q">Session length</div>
  <div class="scale" id="length">
    <button data-v="short" onclick="pickOne('length',this)">Too short</button>
    <button data-v="right" onclick="pickOne('length',this)">About right</button>
    <button data-v="long" onclick="pickOne('length',this)">Too long</button>
  </div>

  <div class="q">Anything we could improve?</div>
  <textarea id="suggest" placeholder="Optional — your suggestions."></textarea>

  <button class="btn" onclick="submitEval()">Submit feedback</button>
  <p class="status" id="status"></p>

<script src="/Presentations/_shared/companion-kit.js"></script>
<script>
  var STATEMENTS = [
    ['engagement', 'The session balanced engagement and content well.'],
    ['facilitator', 'The facilitator was well prepared.'],
    ['relevance', 'The content was relevant to my role.'],
  ];
  var SCALE = [['5', 'Strongly Agree'], ['4', 'Agree'], ['3', 'Neutral'], ['2', 'Disagree'], ['1', 'Strongly Disagree']];
  var picks = { length: null };
  // build likert rows
  var lk = document.getElementById('likert');
  STATEMENTS.forEach(function (st) {
    picks[st[0]] = null;
    var q = document.createElement('div'); q.className = 'q'; q.textContent = st[1]; q.style.fontWeight = '600';
    var row = document.createElement('div'); row.className = 'scale'; row.id = 'lk-' + st[0];
    SCALE.forEach(function (s) {
      var b = document.createElement('button');
      b.setAttribute('data-v', s[0]); b.textContent = s[1].replace('Strongly ', 'S. ');
      b.title = s[1];
      b.onclick = function () { pickOne(st[0], b); };
      row.appendChild(b);
    });
    lk.appendChild(q); lk.appendChild(row);
  });
  function pickOne(key, el) {
    el.parentElement.querySelectorAll('button').forEach(function (b) { b.classList.remove('on'); });
    el.classList.add('on');
    picks[key] = el.getAttribute('data-v');
  }
  function submitEval() {
    var status = document.getElementById('status');
    var likertVals = STATEMENTS.map(function (s) { return picks[s[0]]; }).filter(Boolean).map(Number);
    if (likertVals.length < STATEMENTS.length || !picks.length) { status.textContent = 'Please answer the ratings first.'; status.style.color = '#ffb4ab'; return; }
    var avg = Math.round((likertVals.reduce(function (a, b) { return a + b; }, 0) / likertVals.length) * 10) / 10;
    var detail = { likert: { engagement: picks.engagement, facilitator: picks.facilitator, relevance: picks.relevance }, length: picks.length, suggestion: (document.getElementById('suggest').value || '').trim() };
    if (window.AudienceKit) {
      // submitAnswer stores both the summary (answer) and the detail (selectedValue)
      window.AudienceKit.submitAnswer('adas-ppt-test-slide29', String(avg), JSON.stringify(detail));
    }
    status.style.color = '#38bdf8';
    status.textContent = 'Thank you — feedback submitted!';
  }
</script>
</body>
</html>
