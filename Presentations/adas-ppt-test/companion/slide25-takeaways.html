<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Takeaways</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --blue:#38bdf8; --bg:#0c0f14; --card:#161b22; --line:#2a313c; --ink:#e6e9ee; --muted:#93a1b3; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:'Sora',system-ui,sans-serif; padding:26px 18px 60px; }
  .eyebrow { color:var(--blue); font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; }
  h1 { font-size:28px; margin:6px 0 6px; }
  p.lead { color:var(--muted); font-size:13px; margin:0 0 22px; }
  .item { display:flex; gap:14px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; }
  .num { width:30px; height:30px; border-radius:50%; background:rgba(56,189,248,.12); border:1px solid rgba(56,189,248,.4); color:var(--blue); font-weight:800; display:flex; align-items:center; justify-content:center; flex:none; }
  .item p { margin:3px 0 0; font-size:14px; line-height:1.5; }
  .loading { color:var(--muted); font-size:14px; text-align:center; padding:30px 0; }
</style>
</head>
<body>
  <div class="eyebrow">Key Points · Your Playbook</div>
  <h1>Your 3 takeaways</h1>
  <p class="lead">Generated from how you consulted today — what to lead with going forward.</p>
  <div id="list"><div class="loading">Building your playbook…</div></div>

<script src="/Presentations/_shared/companion-kit.js"></script>
<script>
  function ctx() { var p = new URLSearchParams(location.search); var uid = null; try { uid = localStorage.getItem('autodrive-audience-uid'); } catch (e) {} return { token: p.get('sessionToken'), deck: p.get('deckId') || 'adas-ppt-test', uid: uid }; }
  (function load() {
    var c = ctx();
    var list = document.getElementById('list');
    if (!c.token || !c.uid) { list.innerHTML = '<div class="loading">Open this from your live session to see your takeaways.</div>'; return; }
    var u = new URL('/api/live-session/ai-profile', location.origin);
    u.searchParams.set('sessionToken', c.token); u.searchParams.set('deckId', c.deck);
    u.searchParams.set('mode', 'individual'); u.searchParams.set('userId', c.uid); u.searchParams.set('report', 'takeaways');
    fetch(u.toString(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      var t = (d && d.takeaways) || [];
      if (!t.length) { list.innerHTML = '<div class="loading">Complete the consulting activity (Jamie & Ryan) to get your takeaways.</div>'; return; }
      list.innerHTML = t.map(function (line, i) {
        return '<div class="item"><div class="num">' + (i + 1) + '</div><p>' + line + '</p></div>';
      }).join('');
    }).catch(function () { list.innerHTML = '<div class="loading">Could not load your takeaways. Try again in a moment.</div>'; });
  })();
</script>
</body>
</html>
